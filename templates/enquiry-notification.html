<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New Inquiry</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
        }

        .wrapper {
            width: 100%;
            padding: 20px 0;
        }

        .container {
            width: 600px;
            margin: auto;
            background: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .header {
            background: #0d6efd;
            padding: 20px;
            text-align: center;
        }

        .logo {
            max-height: 60px;
            margin-bottom: 10px;
        }

        .header h2 {
            margin: 0;
            color: #ffffff;
            font-size: 20px;
        }

        .content {
            padding: 24px;
            font-size: 14px;
            color: #333333;
            line-height: 1.6;
        }

        .details {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
            background: #f9fafb;
        }

        .details td {
            border: 1px solid #e5e7eb;
            padding: 10px;
        }

        .details .label {
            width: 30%;
            font-weight: bold;
            background: #f1f5f9;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">

            <!-- Header with Logo -->
            <div class="header">
                <img src="cid:image1" alt="Mainlogo_large" class="logo screen" />

                <h2>New Inquiry Received</h2>
            </div>

            <!-- Content -->
            <div class="content">
                <p>Hello <strong>{{ company_name }}</strong>,</p>

                <p>You have received a new inquiry with the following details:</p>

                <table class="details">
                    <tr>
                        <td class="label">Name</td>
                        <td>{{ name }}</td>
                    </tr>
                    <tr>
                        <td class="label">Email</td>
                        <td>{{ enquirer_email }}</td>
                    </tr>
                    <tr>
                        <td class="label">Phone</td>
                        <td>{{ phone }}</td>
                    </tr>
                    <tr>
                        <td class="label">Message</td>
                        <td>{{ message }}</td>
                    </tr>
                </table>

                <p style="margin-top:16px;">
                    Please respond to this inquiry at your earliest convenience.
                </p>

                <p>
                    Regards,<br>
                    <strong>The OutdoorX Team</strong>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
