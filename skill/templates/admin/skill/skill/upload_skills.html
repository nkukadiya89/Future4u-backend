{% extends "admin/base_site.html" %}
{% block content %}
<h1>Upload skills (CSV / Excel)</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <p><input type="file" name="file" accept=".csv,.xlsx,.xls" required></p>
  <p><button type="submit" class="default">Upload</button>
  <a href="{% url 'admin:skill_skill_changelist' %}">Cancel</a></p>
</form>
{% endblock %}
