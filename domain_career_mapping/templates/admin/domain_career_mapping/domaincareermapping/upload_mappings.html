{% extends "admin/base_site.html" %}

{% block content %}
  <h1>Upload Domain-Career Mappings</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <p>
      <input type="file" name="file" required>
    </p>
    <p>
      <button type="submit" class="default">Upload</button>
    </p>
  </form>
{% endblock %}
